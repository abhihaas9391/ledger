<title>Ledger — calorie &amp; habit tracker</title>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap');
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: #1C1B1F; overscroll-behavior-y: none; }
  body {
    font-family: 'Inter', -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    /* respect iPhone safe areas so content isn't hidden under notch / home indicator */

    min-height: 100vh;
    min-height: 100dvh;
  }
  #root { min-height: 100vh; min-height: 100dvh; }

  .f-body { font-family: 'Inter', sans-serif; }
  .f-mono { font-family: 'JetBrains Mono', monospace; }
  input, button { font-family: inherit; }
  input::placeholder { color: #69656D; }
  button { -webkit-appearance: none; appearance: none; border: none; cursor: pointer; }
  input[type=number] { -moz-appearance: textfield; }
  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-thumb { background: #3A373E; border-radius: 4px; }
  #boot-fallback {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #9C97A0; font-family: 'JetBrains Mono', monospace; font-size: 13px; background: #1C1B1F;
  }
</style>

  // ---- minimal offline cache via an inline service worker (best-effort; safe to fail) ----
  // ---- watchdog: if the app hasn't mounted within a few seconds, replace the
  // silent spinner with a visible error + reload button instead of hanging forever ----
  window.setTimeout(function () {
    var boot = document.getElementById("boot-fallback");
    if (boot && document.body.contains(boot)) {
      boot.innerHTML =
        "<div style='text-align:center;padding:0 24px;'>" +
        "<div style='margin-bottom:10px;'>something didn't load right</div>" +
        "<button id='boot-retry' style='font-family:inherit;font-size:12px;padding:8px 16px;border-radius:8px;background:#2C2A30;color:#EDE9E3;border:1px solid #3A373E;'>reload</button>" +
        "</div>";
      var btn = document.getElementById("boot-retry");
      if (btn) btn.onclick = function () { location.reload(); };
    }
  }, 4000);

  // ---- self-heal: this app is fully self-contained now and never registers a
  // service worker. An earlier version briefly did, which can leave a stale
  // service worker + cache on a device serving old broken code forever. Clean
  // that up unconditionally so updates always take effect. ----
  if ("serviceWorker" in navigator) {
    try {
      navigator.serviceWorker.getRegistrations().then(function (regs) {
        regs.forEach(function (r) { r.unregister(); });
      }).catch(function () {});
    } catch (e) {}
  }
  if (window.caches && caches.keys) {
    try {
      caches.keys().then(function (keys) {
        keys.forEach(function (k) { caches.delete(k); });
      }).catch(function () {});
    } catch (e) {}
  }
