<title>Ledger — calorie &amp; habit tracker</title>

<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap');
  :root { color-scheme: dark; }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: #1C1B1F; overscroll-behavior-y: none; }
  body {
    font-family: 'Inter', -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    /* respect iPhone safe areas so content isn't hidden under notch / home indicator */

    min-height: 100vh;
    min-height: 100dvh;
  }
  #root { min-height: 100vh; min-height: 100dvh; }

  .f-body { font-family: 'Inter', sans-serif; }
  .f-mono { font-family: 'JetBrains Mono', monospace; }
  input, button { font-family: inherit; }
  input::placeholder { color: #69656D; }
  button { -webkit-appearance: none; appearance: none; border: none; cursor: pointer; }
  input[type=number] { -moz-appearance: textfield; }
  ::-webkit-scrollbar { width: 4px; height: 4px; }
  ::-webkit-scrollbar-thumb { background: #3A373E; border-radius: 4px; }
  #boot-fallback {
    position: fixed; inset: 0; display: flex; align-items: center; justify-content: center;
    color: #9C97A0; font-family: 'JetBrains Mono', monospace; font-size: 13px; background: #1C1B1F;
  }
</style>

    try {
      var swCode = "" +
        "const CACHE='ledger-v1';" +
        "self.addEventListener('install',e=>{self.skipWaiting();});" +
        "self.addEventListener('activate',e=>{self.clients.claim();});" +
        "self.addEventListener('fetch',e=>{" +
        "  if(e.request.method!=='GET')return;" +
        "  e.respondWith(" +
        "    caches.match(e.request).then(cached=>{" +
        "      const fetchPromise=fetch(e.request).then(res=>{" +
        "        if(res && res.status===200){ const clone=res.clone(); caches.open(CACHE).then(c=>c.put(e.request, clone)); }" +
        "        return res;" +
        "      }).catch(()=>cached);" +
        "      return cached || fetchPromise;" +
        "    })" +
        "  );" +
        "});";

// ---------- storage adapter: works standalone (localStorage) or inside Claude (window.storage) ----------
const storageAdapter = {
  async get(key) {
    try {
      if (window.storage && typeof window.storage.get === "function") {
        return await window.storage.get(key, false);
      }
    } catch (e) {}
    try {
      const v = window.localStorage.getItem(key);
      return v != null ? { key, value: v, shared: false } : null;
    } catch (e) { return null; }
  },
  async set(key, value) {
    try {
      if (window.storage && typeof window.storage.set === "function") {
        return await window.storage.set(key, value, false);
      }
    } catch (e) {}
    try {
      window.localStorage.setItem(key, value);
      return { key, value, shared: false };
    } catch (e) { return null; }
  },
};

  Gear: ({ size = 16, color = "#fff" }) => (
    <span style={{ fontSize: size, color, lineHeight: 1 }}>⚙</span>
  ),
  Star: ({ size = 10, color = "#fff" }) => (
    <span style={{ fontSize: size, color, lineHeight: 1 }}>★</span>
  ),
};

// ---------- date helpers ----------
const pad = (n) => String(n).padStart(2, "0");
const toKey = (d) => `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
const todayKey = () => toKey(new Date());
const addDays = (key, n) => {
  const [y, m, d] = key.split("-").map(Number);
  const dt = new Date(y, m - 1, d);
  dt.setDate(dt.getDate() + n);
  return toKey(dt);
};
const prettyDate = (key) => {
  const [y, m, d] = key.split("-").map(Number);
  const dt = new Date(y, m - 1, d);
  const t = todayKey();
  if (key === t) return "Today";
  if (key === addDays(t, -1)) return "Yesterday";
  if (key === addDays(t, 1)) return "Tomorrow";
  return dt.toLocaleDateString(undefined, { weekday: "short", month: "short", day: "numeric" });
};
const dayLetter = (key) => {
  const [y, m, d] = key.split("-").map(Number);
  return new Date(y, m - 1, d).toLocaleDateString(undefined, { weekday: "narrow" });
};
const last = (n, endKey) => {
  const out = [];
  for (let i = n - 1; i >= 0; i--) out.push(addDays(endKey, -i));
  return out;
};

// ---------- defaults ----------
const DEFAULT_DATA = {
  profile: { calorieGoal: 2200, proteinGoal: 150, carbGoal: 230, fatGoal: 70, startWeight: null },
  foodLog: {},
  weightLog: [],
  habits: [],
  habitLog: {},
  quickAdds: [],
};
const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36);

function App() {
  const [data, setData] = useState(null);
  const [loaded, setLoaded] = useState(false);
  const [selectedDate, setSelectedDate] = useState(todayKey());
  const [showSettings, setShowSettings] = useState(false);
  const [showAddFood, setShowAddFood] = useState(false);
  const [showAddHabit, setShowAddHabit] = useState(false);
  const [saveError, setSaveError] = useState(false);

  useEffect(() => {
    (async () => {
      try {
        const res = await storageAdapter.get("ledger-app-data");
        if (res && res.value) {
          const parsed = JSON.parse(res.value);
          setData({ ...DEFAULT_DATA, ...parsed, profile: { ...DEFAULT_DATA.profile, ...parsed.profile } });
        } else {
          setData(DEFAULT_DATA);
        }
      } catch (e) {
        setData(DEFAULT_DATA);
      } finally {
        setLoaded(true);
      }
    })();
  }, []);

  const persist = useCallback(async (next) => {
    const res = await storageAdapter.set("ledger-app-data", JSON.stringify(next));
    setSaveError(!res);
  }, []);

  const update = useCallback((updater) => {
    setData((prev) => {
      const next = typeof updater === "function" ? updater(prev) : updater;
      persist(next);
      return next;
    });
  }, [persist]);

  if (!loaded || !data) {
    return (
      <div className="f-mono" style={{ background: C.bg, color: C.textDim, minHeight: "100dvh", display: "flex", alignItems: "center", justifyContent: "center" }}>
        loading ledger…
      </div>
    );
  }

  const todaysFoods = data.foodLog[selectedDate] || [];
  const totals = todaysFoods.reduce(
    (acc, f) => ({
      calories: acc.calories + (Number(f.calories) || 0),
      protein: acc.protein + (Number(f.protein) || 0),
      carbs: acc.carbs + (Number(f.carbs) || 0),
      fat: acc.fat + (Number(f.fat) || 0),
    }),
    { calories: 0, protein: 0, carbs: 0, fat: 0 }
  );

  const addFood = (entry) => {
    update((prev) => {
      const list = prev.foodLog[selectedDate] || [];
      return { ...prev, foodLog: { ...prev.foodLog, [selectedDate]: [...list, { ...entry, id: uid(), time: new Date().toISOString() }] } };
    });
  };
  const removeFood = (id) => {
    update((prev) => ({ ...prev, foodLog: { ...prev.foodLog, [selectedDate]: (prev.foodLog[selectedDate] || []).filter((f) => f.id !== id) } }));
  };
  const saveQuickAdd = (entry) => {
    update((prev) => {
      const exists = prev.quickAdds.some((q) => q.name.toLowerCase() === entry.name.toLowerCase());
      if (exists) return prev;
      return { ...prev, quickAdds: [...prev.quickAdds, { ...entry, id: uid() }].slice(-12) };
    });
  };
  const removeQuickAdd = (id) => update((prev) => ({ ...prev, quickAdds: prev.quickAdds.filter((q) => q.id !== id) }));
  const logWeight = (weight) => {
    update((prev) => {
      const filtered = prev.weightLog.filter((w) => w.date !== selectedDate);
      const nextLog = [...filtered, { date: selectedDate, weight: Number(weight) }].sort((a, b) => (a.date > b.date ? 1 : -1));
      return { ...prev, weightLog: nextLog, profile: { ...prev.profile, startWeight: prev.profile.startWeight ?? Number(weight) } };
    });
  };
  const addHabit = (name) => update((prev) => ({ ...prev, habits: [...prev.habits, { id: uid(), name, createdAt: selectedDate }] }));
  const removeHabit = (id) => update((prev) => ({ ...prev, habits: prev.habits.filter((h) => h.id !== id) }));
  const toggleHabit = (habitId, dateKey) => {
    update((prev) => {
      const dayMap = { ...(prev.habitLog[dateKey] || {}) };
      dayMap[habitId] = !dayMap[habitId];
      return { ...prev, habitLog: { ...prev.habitLog, [dateKey]: dayMap } };
    });
  };
  const updateProfile = (patch) => update((prev) => ({ ...prev, profile: { ...prev.profile, ...patch } }));
  const resetAll = () => update(() => DEFAULT_DATA);

  const weightForDate = data.weightLog.find((w) => w.date === selectedDate)?.weight ?? null;
  const remaining = data.profile.calorieGoal - totals.calories;
  const pct = Math.min(1, totals.calories / Math.max(1, data.profile.calorieGoal));
  const over = totals.calories > data.profile.calorieGoal;

  return (
    <div className="f-body" style={{ background: C.bg, color: C.text, minHeight: "100dvh" }}>
      <div style={{ maxWidth: 448, margin: "0 auto", padding: "24px 16px 96px" }}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 20 }}>
          <div>
            <div className="f-display" style={{ fontSize: 20, fontWeight: 600, letterSpacing: "-0.01em" }}>Ledger</div>
            <div className="f-mono" style={{ fontSize: 11, color: C.textFaint }}>daily intake &amp; discipline log</div>
          </div>
          <button onClick={() => setShowSettings(true)} style={{ padding: 8, borderRadius: 999, background: C.surface, border: `1px solid ${C.border}` }}>
            <Icon.Gear size={16} color={C.textDim} />
          </button>
        </div>

        {saveError && (
          <div className="f-mono" style={{ marginBottom: 16, fontSize: 11, padding: "8px 12px", borderRadius: 8, background: C.brickDim, color: C.brick }}>
            couldn't save — changes may not persist on this device
          </div>
        )}

        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 20, padding: "0 4px" }}>
          <button onClick={() => setSelectedDate((d) => addDays(d, -1))} style={{ padding: 6, borderRadius: 8, background: C.surface }}><Icon.ChevronLeft size={16} color={C.textDim} /></button>
          <div className="f-mono" style={{ fontSize: 14, fontWeight: 500 }}>{prettyDate(selectedDate)}</div>
          <button onClick={() => setSelectedDate((d) => addDays(d, 1))} style={{ padding: 6, borderRadius: 8, background: C.surface }}><Icon.ChevronRight size={16} color={C.textDim} /></button>
        </div>

        <div style={{ borderRadius: 16, padding: 20, marginBottom: 16, background: C.surface, border: `1px solid ${C.border}` }}>
          <div style={{ display: "flex", alignItems: "center", gap: 20 }}>
            <CalorieRing pct={pct} over={over} />
            <div style={{ flex: 1 }}>
              <div className="f-mono" style={{ fontSize: 24, fontWeight: 600, color: over ? C.brick : C.text }}>{Math.abs(remaining)}</div>
              <div className="f-mono" style={{ fontSize: 11, color: C.textFaint, marginBottom: 12 }}>{over ? "kcal over budget" : "kcal remaining"}</div>
              <div className="f-mono" style={{ fontSize: 11, color: C.textDim }}>{totals.calories} / {data.profile.calorieGoal} kcal</div>
            </div>
          </div>
          <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 8, marginTop: 16 }}>
            <MacroBar label="protein" value={totals.protein} goal={data.profile.proteinGoal} color={C.teal} />
            <MacroBar label="carbs" value={totals.carbs} goal={data.profile.carbGoal} color={C.amber} />
            <MacroBar label="fat" value={totals.fat} goal={data.profile.fatGoal} color={C.brick} />
          </div>
        </div>

        <Section title="Food" icon={<Icon.Flame size={14} color={C.amber} />} action={
          <button onClick={() => setShowAddFood(true)} style={{ display: "flex", alignItems: "center", gap: 4, fontSize: 11, padding: "6px 10px", borderRadius: 8, background: C.amberDim, color: C.amber }} className="f-mono">
            <Icon.Plus size={12} color={C.amber} /> log
          </button>
        }>
          {data.quickAdds.length > 0 && (
            <div style={{ display: "flex", gap: 8, overflowX: "auto", paddingBottom: 4, marginBottom: 8 }}>
              {data.quickAdds.map((q) => (
                <button key={q.id} onClick={() => addFood(q)} className="f-mono" style={{ flexShrink: 0, fontSize: 11, padding: "6px 10px", borderRadius: 8, whiteSpace: "nowrap", display: "flex", alignItems: "center", gap: 4, background: C.surface2, border: `1px solid ${C.border}`, color: C.textDim }}>
                  <Icon.Star size={10} color={C.amber} /> {q.name} · {q.calories}
                </button>
              ))}
            </div>
          )}
          {todaysFoods.length === 0 ? (
            <EmptyState text="nothing logged yet — tap log to add your first item" />
          ) : (
            <div style={{ display: "flex", flexDirection: "column", gap: 6 }}>
              {todaysFoods.map((f) => (
                <div key={f.id} style={{ display: "flex", alignItems: "center", justifyContent: "space-between", borderRadius: 8, padding: "10px 12px", background: C.surface2 }}>
                  <div>
                    <div style={{ fontSize: 14, fontWeight: 500 }}>{f.name}</div>
                    <div className="f-mono" style={{ fontSize: 11, color: C.textFaint }}>P{f.protein || 0} · C{f.carbs || 0} · F{f.fat || 0}</div>
                  </div>
                  <div style={{ display: "flex", alignItems: "center", gap: 12 }}>
                    <div className="f-mono" style={{ fontSize: 14, color: C.amber }}>{f.calories}</div>
                    <button onClick={() => removeFood(f.id)}><Icon.Trash size={14} color={C.textFaint} /></button>
                  </div>
                </div>
              ))}
            </div>
          )}
        </Section>

        <Section title="Weight" icon={<Icon.Scale size={14} color={C.teal} />}>
          <WeightPanel data={data} selectedDate={selectedDate} weightForDate={weightForDate} onLog={logWeight} />
        </Section>

        <Section title="Habits" icon={<Icon.CheckSquare size={14} color={C.teal} />} action={
          <button onClick={() => setShowAddHabit(true)} style={{ display: "flex", alignItems: "center", gap: 4, fontSize: 11, padding: "6px 10px", borderRadius: 8, background: C.tealDim, color: C.teal }} className="f-mono">
            <Icon.Plus size={12} color={C.teal} /> add
          </button>
        }>
          {data.habits.length === 0 ? (
            <EmptyState text="no habits yet — add one to start the streak grid" />
          ) : (
            <HabitGrid habits={data.habits} habitLog={data.habitLog} selectedDate={selectedDate} onToggle={toggleHabit} onRemove={removeHabit} />
          )}
        </Section>
      </div>

      {showAddFood && <AddFoodModal onClose={() => setShowAddFood(false)} onSave={addFood} onSaveQuick={saveQuickAdd} />}
      {showAddHabit && <AddHabitModal onClose={() => setShowAddHabit(false)} onSave={addHabit} />}
      {showSettings && (
        <SettingsModal profile={data.profile} quickAdds={data.quickAdds} onRemoveQuickAdd={removeQuickAdd} onClose={() => setShowSettings(false)} onSave={updateProfile} onReset={resetAll} />
      )}
    </div>
  );
}

function Section({ title, icon, action, children }) {
  return (
    <div style={{ marginBottom: 16 }}>
      <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 8, padding: "0 2px" }}>
        <div style={{ display: "flex", alignItems: "center", gap: 6 }}>
          {icon}
          <span className="f-display" style={{ fontSize: 13, fontWeight: 600, letterSpacing: "0.02em" }}>{title}</span>
        </div>
        {action}
      </div>
      <div style={{ borderRadius: 16, padding: 14, background: C.surface, border: `1px solid ${C.border}` }}>{children}</div>
    </div>
  );
}

function EmptyState({ text }) {
  return <div style={{ textAlign: "center", padding: "20px 0", fontSize: 12, color: C.textFaint }}>{text}</div>;
}

function CalorieRing({ pct, over }) {
  const r = 34, c = 2 * Math.PI * r;
  const dash = c * Math.min(pct, 1);
  const color = over ? C.brick : C.amber;
  return (
    <svg width="84" height="84" viewBox="0 0 84 84" style={{ flexShrink: 0 }}>
      <circle cx="42" cy="42" r={r} fill="none" stroke={C.surface2} strokeWidth="8" />
      <circle cx="42" cy="42" r={r} fill="none" stroke={color} strokeWidth="8" strokeLinecap="round" strokeDasharray={`${dash} ${c}`} transform="rotate(-90 42 42)" style={{ transition: "stroke-dasharray 0.4s ease" }} />
    </svg>
  );
}

function MacroBar({ label, value, goal, color }) {
  const pct = Math.min(1, value / Math.max(1, goal));
  return (
    <div>
      <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", marginBottom: 4 }}>
        <span className="f-mono" style={{ fontSize: 10, textTransform: "uppercase", letterSpacing: "0.04em", color: C.textFaint }}>{label}</span>
        <span className="f-mono" style={{ fontSize: 10, color: C.textDim }}>{value}/{goal}</span>
      </div>
      <div style={{ height: 6, borderRadius: 999, overflow: "hidden", background: C.surface2 }}>
        <div style={{ height: "100%", borderRadius: 999, width: `${pct * 100}%`, background: color, transition: "width 0.3s ease" }} />
      </div>
    </div>
  );
}

function Sparkline({ points, color }) {
  // points: array of {x:index, y:value|null}
  const known = points.filter((p) => p.y != null);
  if (known.length < 2) return null;
  const w = 300, h = 56, pad = 6;
  const ys = known.map((p) => p.y);
  const minY = Math.min(...ys), maxY = Math.max(...ys);
  const range = maxY - minY || 1;
  const n = points.length;
  const coords = points.map((p, i) => {
    const x = pad + (i / (n - 1)) * (w - pad * 2);
    if (p.y == null) return null;
    const y = h - pad - ((p.y - minY) / range) * (h - pad * 2);
    return [x, y];
  });
  const segs = [];
  let cur = [];
  coords.forEach((c, i) => {
    if (c) cur.push(c);
    else { if (cur.length > 1) segs.push(cur); cur = []; }
  });
  if (cur.length > 1) segs.push(cur);
  const last = coords.filter(Boolean).slice(-1)[0];
  return (
    <svg width="100%" height={h} viewBox={`0 0 ${w} ${h}`} preserveAspectRatio="none" style={{ display: "block" }}>
      {segs.map((seg, i) => (
        <polyline key={i} points={seg.map((p) => p.join(",")).join(" ")} fill="none" stroke={color} strokeWidth="2" strokeLinecap="round" strokeLinejoin="round" />
      ))}
      {last && <circle cx={last[0]} cy={last[1]} r="3" fill={color} />}
    </svg>
  );
}

function WeightPanel({ data, selectedDate, weightForDate, onLog }) {
  const [val, setVal] = useState("");
  const sorted = data.weightLog;
  const chartData = last(21, selectedDate).map((k) => {
    const found = sorted.find((w) => w.date === k);
    return { x: k, y: found ? found.weight : null };
  });
  const known = chartData.filter((d) => d.y != null);
  const latest = known[known.length - 1]?.y ?? null;
  const first = known[0]?.y ?? null;
  const delta = latest != null && first != null ? +(latest - first).toFixed(1) : null;
  const dir = delta > 0 ? "up" : delta < 0 ? "down" : "flat";

  return (
    <div>
      <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 12 }}>
        <input type="number" inputMode="decimal" placeholder={weightForDate ? String(weightForDate) : "log weight"} value={val} onChange={(e) => setVal(e.target.value)}
          className="f-mono" style={{ flex: 1, fontSize: 14, padding: "10px 12px", borderRadius: 8, outline: "none", background: C.surface2, border: `1px solid ${C.border}`, color: C.text }} />
        <button onClick={() => { if (val) { onLog(val); setVal(""); } }} className="f-mono" style={{ fontSize: 11, padding: "10px 14px", borderRadius: 8, background: C.tealDim, color: C.teal }}>save</button>
      </div>
      {known.length >= 2 ? (
        <div>
          <Sparkline points={chartData} color={C.teal} />
          <div className="f-mono" style={{ display: "flex", alignItems: "center", gap: 6, marginTop: 4, fontSize: 11, color: C.textFaint }}>
            <Icon.Trend size={12} color={dir === "up" ? C.brick : dir === "down" ? C.teal : C.textFaint} dir={dir} />
            <span>{delta != null ? `${delta > 0 ? "+" : ""}${delta} over ${known.length} entries` : "—"}</span>
          </div>
        </div>
      ) : (
        <EmptyState text="log weight on 2+ days to see a trend" />
      )}
    </div>
  );
}

function HabitGrid({ habits, habitLog, selectedDate, onToggle, onRemove }) {
  const days = last(7, selectedDate);
  const streak = (habitId) => {
    let s = 0, d = selectedDate;
    while (habitLog[d]?.[habitId]) { s += 1; d = addDays(d, -1); }
    return s;
  };
  return (
    <div>
      <div style={{ display: "grid", gridTemplateColumns: "1fr repeat(7, 22px)", marginBottom: 6 }}>
        <div />
        {days.map((d) => <div key={d} className="f-mono" style={{ textAlign: "center", fontSize: 9, color: d === selectedDate ? C.teal : C.textFaint }}>{dayLetter(d)}</div>)}
      </div>
      <div style={{ display: "flex", flexDirection: "column", gap: 8 }}>
        {habits.map((h) => (
          <div key={h.id} style={{ display: "grid", gridTemplateColumns: "1fr repeat(7, 22px)", alignItems: "center" }}>
            <div style={{ paddingRight: 8, overflow: "hidden" }}><span style={{ fontSize: 12, whiteSpace: "nowrap", textOverflow: "ellipsis", overflow: "hidden", display: "block" }}>{h.name}</span></div>
            {days.map((d) => {
              const on = !!habitLog[d]?.[h.id];
              return <button key={d} onClick={() => onToggle(h.id, d)} style={{ width: 18, height: 18, borderRadius: 5, margin: "0 auto", background: on ? C.teal : C.surface2, border: `1px solid ${on ? C.teal : C.border}` }} />;
            })}
          </div>
        ))}
      </div>
      <div style={{ display: "flex", flexWrap: "wrap", gap: 6, marginTop: 12 }}>
        {habits.map((h) => {
          const s = streak(h.id);
          return (
            <button key={h.id} onClick={() => onRemove(h.id)} className="f-mono" style={{ fontSize: 10, padding: "4px 8px", borderRadius: 999, display: "flex", alignItems: "center", gap: 4, background: C.surface2, color: C.textFaint }} title="tap to remove">
              {h.name} · {s}d <Icon.X size={9} color={C.textFaint} />
            </button>
          );
        })}
      </div>
    </div>
  );
}

function ModalShell({ title, onClose, children }) {
  return (
    <div onClick={onClose} style={{ position: "fixed", inset: 0, zIndex: 50, display: "flex", alignItems: "flex-end", justifyContent: "center", background: "rgba(0,0,0,0.55)" }}>
      <div onClick={(e) => e.stopPropagation()} className="f-body" style={{ width: "100%", maxWidth: 448, borderRadius: "16px 16px 0 0", padding: "20px 20px calc(20px + env(safe-area-inset-bottom))", background: C.bg2, border: `1px solid ${C.border}`, borderBottom: "none", maxHeight: "85vh", overflowY: "auto" }}>
        <div style={{ display: "flex", alignItems: "center", justifyContent: "space-between", marginBottom: 16 }}>
          <div className="f-display" style={{ fontSize: 16, fontWeight: 600 }}>{title}</div>
          <button onClick={onClose}><Icon.X size={18} color={C.textDim} /></button>
        </div>
        {children}
      </div>
    </div>
  );
}

function Field({ label, ...props }) {
  return (
    <div style={{ marginBottom: 12 }}>
      <div className="f-mono" style={{ fontSize: 10, textTransform: "uppercase", letterSpacing: "0.04em", marginBottom: 4, color: C.textFaint }}>{label}</div>
      <input {...props} className="f-mono" style={{ width: "100%", fontSize: 14, padding: "10px 12px", borderRadius: 8, outline: "none", background: C.surface2, border: `1px solid ${C.border}`, color: C.text }} />
    </div>
  );
}

function AddFoodModal({ onClose, onSave, onSaveQuick }) {
  const [form, setForm] = useState({ name: "", calories: "", protein: "", carbs: "", fat: "" });
  const set = (k) => (e) => setForm((f) => ({ ...f, [k]: e.target.value }));
  const valid = form.name.trim() && form.calories !== "";
  const submit = (andSave) => {
    if (!valid) return;
    const entry = { name: form.name.trim(), calories: Number(form.calories) || 0, protein: Number(form.protein) || 0, carbs: Number(form.carbs) || 0, fat: Number(form.fat) || 0 };
    onSave(entry);
    if (andSave) onSaveQuick(entry);
    onClose();
  };
  return (
    <ModalShell title="Log food" onClose={onClose}>
      <Field label="name" placeholder="e.g. grilled chicken bowl" value={form.name} onChange={set("name")} />
      <Field label="calories" type="number" inputMode="numeric" placeholder="0" value={form.calories} onChange={set("calories")} />
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 8 }}>
        <Field label="protein g" type="number" inputMode="numeric" placeholder="0" value={form.protein} onChange={set("protein")} />
        <Field label="carbs g" type="number" inputMode="numeric" placeholder="0" value={form.carbs} onChange={set("carbs")} />
        <Field label="fat g" type="number" inputMode="numeric" placeholder="0" value={form.fat} onChange={set("fat")} />
      </div>
      <div style={{ display: "flex", gap: 8, marginTop: 8 }}>
        <button disabled={!valid} onClick={() => submit(false)} className="f-mono" style={{ flex: 1, fontSize: 14, padding: "10px 0", borderRadius: 8, background: valid ? C.amberDim : C.surface2, color: valid ? C.amber : C.textFaint }}>log entry</button>
        <button disabled={!valid} onClick={() => submit(true)} className="f-mono" style={{ flex: 1, fontSize: 14, padding: "10px 0", borderRadius: 8, display: "flex", alignItems: "center", justifyContent: "center", gap: 4, background: C.surface2, color: valid ? C.text : C.textFaint, border: `1px solid ${C.border}` }}>
          <Icon.Star size={12} color={valid ? C.amber : C.textFaint} /> log &amp; save
        </button>
      </div>
    </ModalShell>
  );
}

function AddHabitModal({ onClose, onSave }) {
  const [name, setName] = useState("");
  return (
    <ModalShell title="Add habit" onClose={onClose}>
      <Field label="habit name" placeholder="e.g. 10k steps" value={name} onChange={(e) => setName(e.target.value)} />
      <button disabled={!name.trim()} onClick={() => { onSave(name.trim()); onClose(); }} className="f-mono" style={{ width: "100%", fontSize: 14, padding: "10px 0", borderRadius: 8, background: name.trim() ? C.tealDim : C.surface2, color: name.trim() ? C.teal : C.textFaint }}>add habit</button>
    </ModalShell>
  );
}

function SettingsModal({ profile, quickAdds, onRemoveQuickAdd, onClose, onSave, onReset }) {
  const [form, setForm] = useState(profile);
  const [confirmReset, setConfirmReset] = useState(false);
  const set = (k) => (e) => setForm((f) => ({ ...f, [k]: e.target.value }));
  return (
    <ModalShell title="Settings" onClose={onClose}>
      <Field label="daily calorie goal" type="number" inputMode="numeric" value={form.calorieGoal} onChange={set("calorieGoal")} />
      <div style={{ display: "grid", gridTemplateColumns: "1fr 1fr 1fr", gap: 8 }}>
        <Field label="protein g" type="number" inputMode="numeric" value={form.proteinGoal} onChange={set("proteinGoal")} />
        <Field label="carbs g" type="number" inputMode="numeric" value={form.carbGoal} onChange={set("carbGoal")} />
        <Field label="fat g" type="number" inputMode="numeric" value={form.fatGoal} onChange={set("fatGoal")} />
      </div>
      <button onClick={() => { onSave({ ...form, calorieGoal: Number(form.calorieGoal), proteinGoal: Number(form.proteinGoal), carbGoal: Number(form.carbGoal), fatGoal: Number(form.fatGoal) }); onClose(); }}
        className="f-mono" style={{ width: "100%", fontSize: 14, padding: "10px 0", borderRadius: 8, marginBottom: 16, background: C.amberDim, color: C.amber }}>save goals</button>

      {quickAdds.length > 0 && (
        <div style={{ marginBottom: 16 }}>
          <div className="f-mono" style={{ fontSize: 10, textTransform: "uppercase", letterSpacing: "0.04em", marginBottom: 8, color: C.textFaint }}>saved quick-adds</div>
          <div style={{ display: "flex", flexWrap: "wrap", gap: 6 }}>
            {quickAdds.map((q) => (
              <button key={q.id} onClick={() => onRemoveQuickAdd(q.id)} className="f-mono" style={{ fontSize: 10, padding: "4px 8px", borderRadius: 999, display: "flex", alignItems: "center", gap: 4, background: C.surface2, color: C.textFaint }}>
                {q.name} <Icon.X size={9} color={C.textFaint} />
              </button>
            ))}
          </div>
        </div>
      )}

      <div style={{ paddingTop: 12, borderTop: `1px solid ${C.border}` }}>
        {!confirmReset ? (
          <button onClick={() => setConfirmReset(true)} className="f-mono" style={{ fontSize: 11, color: C.brick, background: "transparent" }}>reset all data</button>
        ) : (
          <div>
            <div className="f-mono" style={{ fontSize: 11, marginBottom: 8, color: C.textDim }}>this permanently erases all logs. sure?</div>
            <div style={{ display: "flex", gap: 8 }}>
              <button onClick={() => { onReset(); setConfirmReset(false); onClose(); }} className="f-mono" style={{ fontSize: 11, padding: "6px 12px", borderRadius: 8, background: C.brickDim, color: C.brick }}>yes, erase everything</button>
              <button onClick={() => setConfirmReset(false)} className="f-mono" style={{ fontSize: 11, padding: "6px 12px", borderRadius: 8, background: C.surface2, color: C.textDim }}>cancel</button>
            </div>
          </div>
        )}
      </div>
    </ModalShell>
  );
}

const root = ReactDOM.createRoot(document.getElementById("root"));
root.render(<App />);
</script>
</body>
</html>
